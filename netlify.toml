[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 301 redirects: riefresh.com en www naar apex HTTPS
[[redirects]]
  from = "https://www.riefresh.nl/*"
  to = "https://riefresh.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://riefresh.com/*"
  to = "https://riefresh.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.riefresh.com/*"
  to = "https://riefresh.nl/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
